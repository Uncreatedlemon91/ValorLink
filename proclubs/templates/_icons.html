{# Sidebar icons. Inline SVG, stroked in currentColor, so they take the
   link's colour in every state and cost no extra request. Decorative:
   the label beside each one carries the meaning. #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"
     fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
{%- if name == 'home' %}
  <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>
{%- elif name == 'news' %}
  <rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M7 8h10M7 12h10M7 16h6"/>
{%- elif name == 'matchday' %}
  <rect x="3" y="5" width="18" height="16" rx="1.5"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="2"/>
{%- elif name == 'club' %}
  <path d="M4 20V11M10 20V5M16 20v-7M22 20H2"/>
{%- elif name == 'media' %}
  <rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m10 9 5 3-5 3z"/>
{%- elif name == 'squad' %}
  <circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.5a3 3 0 0 1 0 5.5M18 14.5c1.8.8 3 2.6 3 4.5"/>
{%- elif name == 'panel' %}
  <rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M9 4v16"/>
{%- elif name == 'clock' %}
  <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- elif name == 'shield' %}
  <path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.2 7.5 9.5 4.4-1.3 7.5-4.9 7.5-9.5V6z"/>
{%- elif name == 'file' %}
  <path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5M8.5 13h7M8.5 16.5h7"/>
{%- elif name == 'book' %}
  <path d="M3.5 5.5c3-1.3 5.8-1.3 8.5.5 2.7-1.8 5.5-1.8 8.5-.5v13c-3-1.3-5.8-1.3-8.5.5-2.7-1.8-5.5-1.8-8.5-.5z"/><path d="M12 6v13"/>
{%- elif name == 'chevron' %}
  <path d="m9 6 6 6-6 6"/>
{%- elif name == 'ball' %}
  <circle cx="12" cy="12" r="8.5"/><path d="m12 8 3.3 2.4-1.3 3.9h-4l-1.3-3.9z"/><path d="M12 8V3.5M15.3 10.4l4-1.6M14 14.3l2.6 3.5M10 14.3l-2.6 3.5M8.7 10.4l-4-1.6"/>
{%- elif name == 'gloves' %}
  <path d="M7 21v-6.5L5 10V6.5a1.5 1.5 0 0 1 3 0V10m0-4.5v-1a1.5 1.5 0 0 1 3 0V10m0-5a1.5 1.5 0 0 1 3 0v5m0-3.5a1.5 1.5 0 0 1 3 0v8L15 21"/>
{%- elif name == 'whistle' %}
  <circle cx="9" cy="14" r="5"/><path d="M12.5 10.5 20 6v4.5l-6 1.5"/><path d="M4 7l2 2M8 4.5 8.6 7"/>
{%- elif name == 'boot' %}
  <path d="M5 5h5v6.5l8 2.5a3 3 0 0 1 2 2.8V18H4.5A1.5 1.5 0 0 1 3 16.5V7a2 2 0 0 1 2-2z"/><path d="M6 21v-3M10 21v-3M14 21v-3"/>
{%- elif name == 'target' %}
  <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>
{%- elif name == 'bell' %}
  <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>
{%- elif name == 'pulse' %}
  <path d="M3 12h4l2.5-6 4 12L16 12h5"/>
{%- elif name == 'menu' %}
  <path d="M4 7h16M4 12h16M4 17h16"/>
{%- endif %}
</svg>
{%- endmacro %}
