<div class="topbar">
  {% set p = request.url.path %}
  <div class="topbar-left">
    <a href="/" class="{{ 'on' if p == '/' }}">ValorLink</a>
    <a href="/find" class="{{ 'on' if p == '/find' }}">Find a Unit</a>
    <a href="/players" class="{{ 'on' if p == '/players' }}">Find a Player</a>
    <a href="/feed" class="{{ 'on' if p == '/feed' }}">Feed</a>
    {% if user %}<a href="/my-units" class="{{ 'on' if p == '/my-units' }}">My Units</a>{% endif %}
    {% if user %}<a href="/register" class="{{ 'on' if p == '/register' }}">Raise a Unit</a>{% endif %}
  </div>
  <div class="topbar-right">
    {% if user %}
      <details class="account-menu">
        <summary><b>{{ user.name }}</b> <span class="uswitch-caret">▾</span></summary>
        <div class="uswitch-menu">
          <a href="/me" class="uswitch-item{{ ' current' if p == '/me' or p.startswith('/u/') }}">My record</a>
          <a href="/logout" class="uswitch-item">Sign out</a>
        </div>
      </details>
    {% else %}
      <span class="topbar-actions"><a href="/auth/discord/login">Sign in with Discord</a></span>
    {% endif %}
  </div>
</div>
