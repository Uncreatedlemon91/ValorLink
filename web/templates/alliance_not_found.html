<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ValorLink — Alliance Not Found</title>
  <link rel="stylesheet" href="/static/css/valorlink.css?v={{ css_v }}">
</head>
<body>
  <div class="fx-shell">
    {% include "_apex_topbar.html" %}
    <header class="fx-header">
      <div class="fx-header-inner">
        <div class="fx-heading"><h1>Alliance Not Found</h1></div>
      </div>
    </header>
    <main class="fx-main">
      <div class="fx-card fx-empty">
        <div class="fx-empty-icon">✵</div>
        <h3>No Such Alliance</h3>
        <p>This coalition doesn't exist, or it has disbanded.</p>
        <p style="margin-top:14px;"><a class="fx-btn fx-btn-primary" href="/find">Find a Unit</a></p>
      </div>
    </main>
  </div>
</body>
</html>
